<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1370" data-font-family="2"><defs><marker id="arrow"><path d="M0 0 L10 4 L0 8 Z"/></marker></defs><rect id="paper" x="0" y="0" width="1700" height="1370" rx="0" fill="#F5F6FB" stroke="none" stroke-width="2"/><text id="title" x="75" y="90" font-size="50" fill="#222853" text-anchor="start">研究型 Agent 的协作网络</text><text id="subtitle" x="78" y="145" font-size="24" fill="#707796" text-anchor="start">一个任务中枢，多个专业角色，一份可追溯的共享上下文</text><rect id="task-boundary" x="75" y="385" width="1550" height="585" rx="28" fill="#EBEDF7" stroke="#C1C7E0" stroke-width="2"/><text id="task-boundary-label" x="105" y="425" font-size="22" fill="#707796" text-anchor="start">单次研究任务</text><rect id="shared-boundary" x="75" y="1050" width="1550" height="245" rx="24" fill="#222853" stroke="none" stroke-width="2"/><text id="shared-label" x="110" y="1100" font-size="28" fill="#FFFFFF" text-anchor="start">共享能力与持久状态</text><polyline id="question-to-hub" points="850,310 850,465" fill="none" stroke="#222853" stroke-width="3" marker-end="url(#arrow)" data-start-id="question" data-end-id="hub"/><polyline id="researcher-spoke" points="660,555 420,555" fill="none" stroke="#5961AF" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)" data-start-id="hub" data-end-id="researcher"/><polyline id="analyst-spoke" points="1040,555 1280,555" fill="none" stroke="#5961AF" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)" data-start-id="hub" data-end-id="analyst"/><polyline id="writer-spoke" points="850,645 850,790" fill="none" stroke="#5961AF" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)" data-start-id="hub" data-end-id="writer"/><polyline id="writer-output" points="1000,850 1260,850" fill="none" stroke="#222853" stroke-width="3" marker-end="url(#arrow)" data-start-id="writer" data-end-id="answer"/><polyline id="shared-readwrite" points="660,610 565,610 565,1005 850,1005 850,1050" fill="none" stroke="#5961AF" str